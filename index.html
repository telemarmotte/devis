<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demande de devis · Télé-Marmotte</title>
<meta name="description" content="Concert, teaser, clip, documentaire : décrivez votre projet en quelques questions et obtenez tout de suite une estimation du prix.">
<meta property="og:title" content="Demande de devis vidéo · Télé-Marmotte">
<meta property="og:description" content="Captation, montage, mixage : quelques questions et une estimation du prix tout de suite.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://image.jimcdn.com/app/cms/image/transf/dimension=240x10000:format=jpg/path/s2a878a15d7bf552c/image/i2e80acb7fc793f25/version/1521546626/image.jpg">
<meta name="theme-color" content="#9cc7a1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto+Slab:wght@500;600;700&display=swap">
<style>
/* Aux couleurs du site tele-marmotte.com : blanc, bandeau vert sauge, texte vert très sombre, Roboto Slab. */
:root {
  --bg: #f5f8f3;
  --surface: #ffffff;
  --ink: #112611;
  --muted: #5b6a5a;
  --line: #dce6d9;
  --line-strong: #b7c8b3;
  --sage: #9cc7a1;
  --sage-ink: #0f2a14;
  --accent: #2e6b3b;
  --accent-ink: #ffffff;
  --accent-soft: #e5f1e5;
  --est-bg: #1d4527;
  --est-ink: #f2f8f0;
  --warn: #9a3b1f;
  --shadow: 0 1px 2px rgba(17, 38, 17, .05), 0 3px 12px rgba(17, 38, 17, .05);
  --f-head: 'Roboto Slab', Georgia, serif;
  --f-body: 'Open Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1911;
    --surface: #172419;
    --ink: #e7f0e5;
    --muted: #a2b39f;
    --line: #273a2a;
    --line-strong: #3b523f;
    --sage: #2b4330;
    --sage-ink: #e7f0e5;
    --accent: #8cc797;
    --accent-ink: #0c1a0f;
    --accent-soft: #1d3322;
    --est-bg: #1d3322;
    --est-ink: #eef6ec;
    --warn: #f0a07f;
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.5 var(--f-body);
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

#app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

/* ---------- Bandeau ---------- */
header {
  position: sticky; top: 0; z-index: 5;
  background: var(--sage);
  color: var(--sage-ink);
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar {
  max-width: 600px; margin: 0 auto;
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
  height: 52px; padding: 0 8px;
}
.back {
  width: 44px; height: 44px; border: 0; border-radius: 50%;
  background: transparent; display: grid; place-items: center;
}
.back[hidden] { display: grid !important; visibility: hidden; }
.back:active { background: rgba(0, 0, 0, .08); }
.back svg { width: 24px; height: 24px; }
.brand {
  justify-self: center;
  font-family: var(--f-head); font-weight: 600; font-size: 17px; letter-spacing: .01em;
  color: inherit; text-decoration: none;
}
.count { justify-self: end; padding-right: 8px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; opacity: .8; }
.progress { height: 4px; background: rgba(17, 38, 17, .12); }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }

/* ---------- Contenu ---------- */
main { flex: 1; width: 100%; max-width: 600px; margin: 0 auto; padding: 26px 16px 20px; }
main:focus { outline: none; }
.step { animation: in .28s cubic-bezier(.2, .7, .2, 1) both; }
.step.rev { animation-name: inrev; }
.step.still { animation: none; }
@keyframes in { from { opacity: 0; transform: translateX(18px); } }
@keyframes inrev { from { opacity: 0; transform: translateX(-18px); } }
@media (prefers-reduced-motion: reduce) { .step { animation: none; } .progress i { transition: none; } }

.eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1.q {
  font-family: var(--f-head); font-weight: 600;
  font-size: clamp(25px, 6.8vw, 32px); line-height: 1.18;
  margin: 0 0 8px; text-wrap: balance;
}
h1.q:focus { outline: none; }
.hint { margin: 0 0 20px; color: var(--muted); }
.lead { font-size: 18px; margin: 0 0 18px; }
.small { font-size: 14px; color: var(--muted); }

/* Choix */
.opts { display: grid; gap: 10px; margin-top: 18px; }
.hint + .opts { margin-top: 0; }
.opt {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px;
  width: 100%; min-height: 60px; padding: 13px 16px;
  text-align: left; border: 1.5px solid var(--line); border-radius: 14px;
  background: var(--surface); box-shadow: var(--shadow);
  transition: border-color .15s, background-color .15s, transform .1s;
}
.opt.has-ico { grid-template-columns: auto 1fr auto; }
.opt:active { transform: scale(.985); }
.opt .ico {
  width: 42px; height: 42px; border-radius: 11px;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
}
.opt .ico svg { width: 24px; height: 24px; }
.opt .t { display: block; font-weight: 650; line-height: 1.3; }
.opt .s { display: block; margin-top: 2px; font-size: 15px; line-height: 1.35; color: var(--muted); }
.opt .pr { display: block; margin-top: 4px; font-weight: 700; color: var(--accent); }
.opt .tag {
  display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; vertical-align: 2px;
  font-size: 12px; font-weight: 700; background: var(--accent); color: var(--accent-ink);
}
.opt .mk {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--line-strong); display: grid; place-items: center; flex: none;
}
.opt.check .mk { border-radius: 7px; }
.opt .mk svg { width: 16px; height: 16px; opacity: 0; color: var(--accent-ink); }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-checked="true"] .mk { background: var(--accent); border-color: var(--accent); }
.opt[aria-checked="true"] .mk svg { opacity: 1; }
.opt:not(.check)[aria-checked="true"] .mk::after { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-ink); }
.opt:not(.check) .mk svg { display: none; }

/* Champs */
.field { display: grid; gap: 6px; margin: 0 0 16px; }
.field > label, .lbl-row { font-weight: 600; font-size: 15px; }
.opt-l { font-weight: 400; color: var(--muted); }
input[type=text], input[type=email], input[type=tel], input[type=date], input[type=time], textarea {
  width: 100%; min-width: 0; min-height: 52px; padding: 12px 14px;
  font-size: 17px; border: 1.5px solid var(--line-strong); border-radius: 12px;
  background: var(--surface); color: var(--ink);
  -webkit-appearance: none; appearance: none;
}
input[type=date], input[type=time] { display: block; text-align: left; }
input::-webkit-date-and-time-value { text-align: left; }
textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
::placeholder { color: var(--muted); opacity: .75; }
.after { margin-top: 18px; }
.after:empty { display: none; }

.dates { display: grid; gap: 8px; }
.daterow { display: grid; grid-template-columns: minmax(0, 1fr) 112px 40px; gap: 8px; align-items: center; }
.daterow.nohour { grid-template-columns: minmax(0, 1fr) 40px; }
.daterow-head { display: grid; grid-template-columns: minmax(0, 1fr) 112px 40px; gap: 8px; font-size: 14px; color: var(--muted); }
.daterow-head.nohour { grid-template-columns: minmax(0, 1fr) 40px; }
.rm { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); display: grid; place-items: center; }
.rm svg { width: 20px; height: 20px; }
.rm[hidden] { display: block !important; visibility: hidden; }
.addrow {
  width: 100%; min-height: 48px; margin-top: 4px;
  border: 1.5px dashed var(--line-strong); border-radius: 12px; background: transparent;
  color: var(--accent); font-weight: 650;
}
.toggle { display: flex; align-items: center; gap: 12px; margin: 16px 0 6px; font-weight: 600; cursor: pointer; }
.toggle input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; flex: none; }
.flou { margin-top: 10px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); }
.sep { height: 1px; background: var(--line); margin: 22px 0 18px; border: 0; }

.stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line-strong); border-radius: 14px; background: var(--surface); overflow: hidden; }
.stepper button { width: 60px; height: 56px; border: 0; background: transparent; font-size: 26px; line-height: 1; color: var(--accent); }
.stepper button:active { background: var(--accent-soft); }
.stepper output { min-width: 56px; text-align: center; font-family: var(--f-head); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border: 1.5px solid var(--line-strong); border-radius: 14px; background: var(--surface); }
.seg button { min-height: 44px; padding: 6px 4px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 650; font-size: 15px; line-height: 1.2; }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); font-size: 15px; font-weight: 600; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.small a { color: var(--accent); font-weight: 600; }

.sugg { display: grid; margin-top: 4px; border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--surface); overflow: hidden; box-shadow: var(--shadow); }
.sugg-it { min-height: 46px; padding: 10px 14px; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; font-size: 15px; color: var(--muted); }
.sugg-it:first-child { border-top: 0; }
.sugg-it b { color: var(--ink); font-weight: 650; }
.sugg-it:active, .sugg-it:focus-visible { background: var(--accent-soft); outline: none; }
.ville-info { margin: 2px 0 0; }
.ville-info:empty { display: none; }
.live { margin: 0 0 8px; text-align: center; font-size: 14px; color: var(--muted); }
.live b { display: inline-block; color: var(--accent); font-size: 15px; font-weight: 700; }
.live.bump b { animation: bump .45s ease; }
@keyframes bump { 40% { transform: scale(1.14); } }
@media (prefers-reduced-motion: reduce) { .live.bump b { animation: none; } }

/* Estimation */
.est { background: var(--est-bg); color: var(--est-ink); border-radius: 20px; padding: 20px 20px 10px; }
.est .lbl { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.est .lbl i { width: 8px; height: 8px; border-radius: 50%; background: #ff5b48; box-shadow: 0 0 6px #ff5b48; }
.est .big { font-family: var(--f-head); font-weight: 700; font-size: clamp(38px, 11vw, 54px); line-height: 1.05; margin: 10px 0 6px; font-variant-numeric: tabular-nums; }
.est .big.range { font-size: clamp(30px, 8.6vw, 44px); }
.est .rng { opacity: .8; font-size: 15px; }
.est ul { list-style: none; margin: 16px 0 0; padding: 0; border-top: 1px solid rgba(255, 255, 255, .18); }
.est li { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; font-size: 15px; border-bottom: 1px solid rgba(255, 255, 255, .1); }
.est li:last-child { border-bottom: 0; }
.est li b { white-space: nowrap; font-weight: 650; font-variant-numeric: tabular-nums; }
.notes { margin: 14px 0 0; padding: 0 0 0 18px; color: var(--muted); font-size: 14px; }
.notes li { margin: 3px 0; }
.tip { margin: 16px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: 15px; }
.tip b { color: var(--accent); }

.recap { margin-top: 26px; }
.recap h2 { font-family: var(--f-head); font-weight: 600; font-size: 20px; margin: 0 0 6px; }
.recap dl { margin: 0; border-top: 1px solid var(--line); }
.recap .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.recap dt { grid-column: 1; font-size: 13px; color: var(--muted); }
.recap dd { grid-column: 1; margin: 1px 0 0; overflow-wrap: anywhere; white-space: pre-line; }
.recap .edit { grid-column: 2; grid-row: 1 / span 2; align-self: center; border: 0; background: transparent; color: var(--accent); font-weight: 650; font-size: 15px; padding: 10px 4px; }

/* Accueil, fin */
.logo { display: block; width: 116px; height: 116px; margin: 4px auto 18px; border-radius: 50%; background: #fff; object-fit: cover; box-shadow: 0 0 0 4px var(--surface), var(--shadow); }
.welcome h1.q { text-align: center; }
.welcome .lead { text-align: center; }
.meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; padding: 0; list-style: none; }
.meta li { padding: 5px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 650; }
.resume { padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); margin-bottom: 18px; }
.resume p { margin: 0 0 6px; }
.linkbtn { border: 0; background: none; padding: 6px 0; color: var(--accent); font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
details.tarifs { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 0 16px; }
details.tarifs summary { padding: 14px 0; font-weight: 650; cursor: pointer; color: var(--accent); list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.tarifs summary::-webkit-details-marker { display: none; }
details.tarifs summary::after { content: '+'; font-size: 22px; line-height: 1; }
details.tarifs[open] summary::after { content: '\2212'; }
.tarifs ul { list-style: none; margin: 0; padding: 0; }
.tarifs li { display: flex; justify-content: space-between; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); }
.tarifs li small { display: block; color: var(--muted); font-size: 14px; line-height: 1.35; }
.tarifs li b { white-space: nowrap; color: var(--accent); }
.tarifs p { margin: 4px 0 14px; }

.done-ico { width: 84px; height: 84px; margin: 10px 0 18px; border-radius: 22px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.done-ico svg { width: 46px; height: 46px; }
.actions { display: grid; gap: 10px; margin: 22px 0 14px; }

/* Barre du bas */
.bar {
  position: sticky; bottom: 0; z-index: 4;
  padding: 18px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to bottom, transparent, var(--bg) 16px);
}
.bar .inner { max-width: 568px; margin: 0 auto; }
.err { min-height: 0; margin: 0 0 8px; color: var(--warn); font-weight: 600; font-size: 15px; }
.err:empty { display: none; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 54px; padding: 12px 18px;
  border: 0; border-radius: 14px;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 17px; text-decoration: none; text-align: center;
  box-shadow: 0 6px 18px rgba(46, 107, 59, .25);
}
.btn:active { transform: scale(.99); }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn.ghost { background: transparent; color: var(--accent); box-shadow: none; border: 1.5px solid var(--line-strong); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
noscript p { max-width: 560px; margin: 40px auto; padding: 0 16px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="topbar">
      <button id="back" class="back" type="button" aria-label="Question précédente" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <a class="brand" id="brand" href="https://www.tele-marmotte.com/">Télé-Marmotte</a>
      <span id="count" class="count" aria-live="polite"></span>
    </div>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <div class="bar" id="foot">
    <div class="inner">
      <p class="live" id="live" hidden></p>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" id="next" type="button">Continuer</button>
    </div>
  </div>
</div>
<noscript><p>Ce questionnaire a besoin de JavaScript. Vous pouvez aussi m’écrire directement : simonhanot@hotmail.fr</p></noscript>
<script>
(() => {
'use strict';

/* =====================================================================
   Réglages
   ===================================================================== */
const CONFIG = {
  email: ['simonhanot', 'hotmail.fr'].join('@'),
  // Après le premier envoi, FormSubmit envoie un mail d'activation, puis propose un alias
  // (une suite de lettres) : le mettre ici pour ne plus exposer l'adresse dans la page.
  formsubmitAlias: '',
  site: 'https://www.tele-marmotte.com/',
  logo: 'https://image.jimcdn.com/app/cms/image/transf/dimension=240x10000:format=jpg/path/s2a878a15d7bf552c/image/i2e80acb7fc793f25/version/1521546626/image.jpg',
  confidentialite: 'https://www.tele-marmotte.com/j/privacy',
  noteDeplacement: 'Hors frais de déplacement depuis Strasbourg (67200), précisés dans le devis selon le lieu.',
  // Point de départ des déplacements (centre de la commune, d'après geo.api.gouv.fr).
  depart: {nom: 'Strasbourg', lat: 48.5691, lon: 7.7621},
  // Règle des frais : km aller au-delà de gratuitKm, × 2 (aller-retour) × euroParKm, par jour de tournage.
  // Tant que euroParKm vaut null, la page affiche seulement la distance, sans prix.
  deplacement: {gratuitKm: null, euroParKm: null, facteurRoute: 1.2},
};
const ENDPOINT = 'https://formsubmit.co/ajax/' + (CONFIG.formsubmitAlias || CONFIG.email);

/* Tarifs TTC. Calibrage : 5 à 7 caméras + spectacle entier (1 h à 1 h 30) + teaser + mixage = 800 €. */
const T = {
  captation: {2: 200, 4: 280, 6: 350, 8: 450},  // une date : installation, caméras, rushes
  reprise: 0.8,                                   // chaque représentation en plus du même spectacle
  montage: {2: 150, 4: 200, 6: 250, 8: 300},      // spectacle entier d'1 h à 1 h 30
  duree: {30: 0.5, 60: 0.75, 90: 1, 120: 1.25, 180: 1.5},
  montageReprise: 0.5,                            // comparer chaque passage entre les soirs, recaler les raccords
  mixageReprise: 0.3,
  teaser: 100, teaserSeul: 150, versionCourte: 30,
  mixage: 100, recalage: 40, sonCamera: 0.6,
  prep: 150,                                      // fichiers fournis par le client (synchro, tri)
  montageSeul: 1.2,                               // montage de rushes que je n'ai pas tournés
  minimum: 250,                                   // aucune estimation en dessous
  verticale: 50, morceauxSepares: 50, titres: 50,
  morceaux: {captation: {2: 250, 4: 300, 6: 350, 8: 450}, montage: {2: 40, 4: 60, 6: 80, 8: 100}, mixage: 40, recalage: 15, titres: 30, degressif: 0.7},
  clip: {
    jour: {performance: 350, histoire: 450, melange: 400, nsp: 400},
    montage: {performance: 250, histoire: 400, melange: 350, nsp: 350},
    jourSup: 0.15, mixage: 80, makingof: 150,
  },
  docu: {
    jour: 300, montageJour: 200,
    jours: {5: [2, 3], 15: [4, 6], 30: [7, 10], 60: [12, 18], 90: [20, 30]},
    mixage: {5: 80, 15: 150, 30: 250, 60: 400, 90: 600},
    bandeAnnonce: 150, sousTitres: 100, verticale: 50,
  },
  urgence: 0.2,             // sur la post-production
  degressifConcerts: 0.1,   // à partir de 3 concerts différents
  marge: 0.07, margeClip: 0.2, margeDocu: 0.1,
};

/* =====================================================================
   Textes des choix
   ===================================================================== */
const TYPES = {
  spectacle: {t: 'Un concert ou un spectacle entier', s: 'Filmé du début à la fin', ico: 'stage', court: 'Spectacle entier'},
  teaser:    {t: 'Un teaser', s: 'Une bande-annonce d’une minute environ', ico: 'bolt', court: 'Teaser'},
  morceaux:  {t: 'Un ou quelques morceaux', s: 'Live session, vidéos pour YouTube ou les réseaux', ico: 'note', court: 'Morceaux'},

    const u = S.type === 'clip' || S.type === 'docu' ? ['jour de tournage', 'jours de tournage'] : S.type === 'spectacle' ? ['représentation', 'représentations'] : ['date', 'dates'];
    return `Pas encore fixées · ${pluriel(S.nbApprox, u[0], u[1])}${S.periode.trim() ? ', ' + S.periode.trim() : ''}`;
  }
  return S.dates.filter(r => r.d).sort((a, b) => a.d.localeCompare(b.d))
    .map(r => fmtDate(r.d) + (r.h ? ' à ' + fmtHeure(r.h) : '')).join('\n');
}
function camerasTxt() {
  if (!S.services.tournage) return CAMS_FOURNIES[S.camerasFournies]?.t + ' (vos images)';
  if (S.cameras === 'conseil') return `${CAMS[camsEff()].t} (sur conseil)`;
  return CAMS[camsEff()].t;
}
function delaiTxt() {
  if (S.delai === 'date' && S.delaiDate) return `Pour le ${fmtDate(S.delaiDate)}${urgent() ? ' (délai court)' : ''}`;
  return DELAIS[S.delai]?.t;
}
function rows() {
  const r = [];
  const add = (k, v, id) => { if (v) r.push([k, v, id]); };
  add('Type de vidéo', TYPES[S.type]?.t, 'type');
  add(projet() ? 'Projet' : 'Ensemble', S.nom.trim(), 'nom');
  if (has('formule')) add('Formule', FORMULES[S.formule]?.t, 'formule');
  if (has('clipStyle')) add('Genre de clip', CLIP[S.clipStyle]?.t, 'clipStyle');
  if (has('desc')) add('Description', S.desc.trim(), 'desc');
  const sv = [S.services.tournage && 'tournage', S.services.montage && 'montage', S.services.mixage && 'mixage'].filter(Boolean).join(', ');
  add('Prestations', sv.charAt(0).toUpperCase() + sv.slice(1), has('services') ? 'services' : 'formule');
  if (has('quand')) { add('Dates', datesTxt(), 'quand'); add('Lieu', lieuTxt(), 'quand'); }
  if (has('meme')) add('Représentations', MEME[S.memeSpectacle]?.t, 'meme');
  if (has('formation')) add('Sur scène', [FORMATIONS[S.formation]?.t, S.instruments.trim()].filter(Boolean).join(' · '), 'formation');
  if (has('cameras')) add('Caméras', camerasTxt(), 'cameras');
  else if (S.type === 'spectacle' && S.services.tournage) add('Caméras', CAMS[camsEff()].t, 'formule');
  if (has('duree')) add('Durée', DUREES[S.duree]?.t, 'duree');
  if (has('nbMorceaux')) add('Morceaux', String(S.nbMorceaux), 'nbMorceaux');
  if (has('dureeFinale')) add('Durée du film', DUREES_FILM[S.dureeFinale]?.t, 'dureeFinale');
  if (has('livrables')) {
    const opts = LIVRABLES[S.type];
    const l = Object.keys(opts).filter(k => S.livrables[k]).map(k => opts[k].t);
    if (S.type === 'teaser') l.unshift('Un teaser d’une minute');
    add('À recevoir', l.join('\n') || 'Pas d’option en plus', 'livrables');
  }
  if (has('son')) add('Son', (S.services.tournage ? SONS_TOURNAGE : SONS_FOURNIS)[S.son]?.t, 'son');
  if (has('budget')) add('Budget', BUDGETS[S.budget]?.t, 'budget');
  if (has('delai')) add('Délai', delaiTxt(), 'delai');
  return r;
}
function lieuTxt() {
  const v = S.lieuGeo ? `${S.lieuGeo.nom} (${S.lieuGeo.cp})` : S.ville.trim();
  const dep = deplacement();
  return [S.salle.trim(), v].filter(Boolean).join(', ') + (dep ? `\n≈ ${dep.km} km de ${CONFIG.depart.nom} par la route` : '');
}
const sujet = () => `Demande de devis · ${TYPES[S.type]?.court || 'Vidéo'} · ${S.nom.trim() || S.contact.nom.trim()}`;
function texte() {
  const E = estimer(), F = fourchette(E);
  const L = ['Demande de devis vidéo (Télé-Marmotte)', ''];
  for (const [k, v] of rows()) L.push(`${k} : ${v.replace(/\n/g, ', ')}`);
  L.push('', `Estimation : ${F.court}`);
  for (const l of E.lignes) L.push(`  - ${l.label} : ${prixLigne(l)}`);
  const c = S.contact;
  L.push('', `Nom : ${c.nom.trim()}`);
  if (c.email.trim()) L.push(`Email : ${c.email.trim()}`);
  if (c.tel.trim()) L.push(`Téléphone : ${c.tel.trim()}`);
  L.push(`Répondre par : ${PREFS[c.pref].t}`);
  if (c.source) L.push(`M’a connu par : ${SOURCES[c.source]}`);
  if (S.message.trim()) L.push('', 'Message :', S.message.trim());
  return L.join('\n');
}
function payload() {
  const E = estimer(), F = fourchette(E);
  const p = {
    _subject: sujet(), _template: 'table', _captcha: 'false', _honey: S.honey,
    'Nom': S.contact.nom.trim(),
  };
  const c = S.contact;
  if (c.email.trim()) p.email = c.email.trim();
  if (c.tel.trim()) p['Téléphone'] = c.tel.trim();
  p['Répondre par'] = PREFS[c.pref].t;
  if (c.source) p['Connu par'] = SOURCES[c.source];
  for (const [k, v] of rows()) p[k] = v.replace(/\n/g, ', ');
  p['Estimation'] = F.court;
  if (E.lignes.length) p['Détail de l’estimation'] = E.lignes.map(l => `${l.label} : ${prixLigne(l)}`).join(' ; ');
  if (S.message.trim()) p['Message'] = S.message.trim();
  return p;
}

let cur = 0, depth = 0, advTimer = null, resumeAt = null, preset = false, sending = false, retourRecap = false;

function render(dir = 1) {
  const st = STEPS[cur];
  const box = h('section', {class: 'step' + (dir < 0 ? ' rev' : dir === 0 ? ' still' : '')});
  if (!st.meta) {
    if (st.sec) box.append(h('p', {class: 'eyebrow'}, st.sec()));
    box.append(h('h1', {class: 'q', id: 'q', tabindex: '-1'}, st.title()));
    const hint = st.hint && st.hint();
    if (hint) box.append(h('p', {class: 'hint'}, hint));
  }
  if (st.kind === 'single') renderChoix(st, box, false);
  else if (st.kind === 'multi') renderChoix(st, box, true);
  else if (st.kind === 'text' || st.kind === 'textarea') renderTexte(st, box);
  else st.render(box);
  $('#main').replaceChildren(box);

  const qs = questions(), i = qs.indexOf(st);
  $('#bar').style.width = st.id === 'welcome' ? '0%' : i < 0 ? '100%' : `${Math.round(i / qs.length * 100)}%`;
  $('#count').textContent = i >= 0 ? `${i + 1}/${qs.length}` : '';
  $('#back').hidden = st.id === 'welcome' || st.id === 'fin';
  $('#foot').hidden = !!st.noFoot;
  $('#next').textContent = st.button ? st.button() : 'Continuer';
  $('#next').disabled = false;
  hideErr();
  majLive();
  if (dir !== 0) {
    window.scrollTo(0, 0);
    const af = box.querySelector('[data-autofocus]') || box.querySelector('h1');
    if (af) af.focus({preventScroll: true});
  }
}

function optEl(o, multi, onpick) {
  const b = h('button', {
      type: 'button', role: multi ? 'checkbox' : 'radio',
      class: 'opt' + (o.ico ? ' has-ico' : '') + (multi ? ' check' : ''),
      'aria-checked': 'false', 'data-v': String(o.v), onclick: onpick,
    },
    o.ico && h('span', {class: 'ico', html: svg(ICONS[o.ico])}),
    h('span', {},
      h('span', {class: 't'}, o.t, o.tag && h('span', {class: 'tag'}, o.tag)),
      o.s && h('span', {class: 's'}, o.s),
      o.price && h('span', {class: 'pr'}, o.price)),
    h('span', {class: 'mk', html: SVG_CHECK}));
  return b;
}
function renderChoix(st, box, multi) {
  const group = h('div', {class: 'opts', role: multi ? 'group' : 'radiogroup', 'aria-labelledby': 'q'});
  const afterBox = st.after ? h('div', {class: 'after'}) : null;
  const draw = () => {
    for (const b of group.children) {
      const v = b.dataset.v;
      b.setAttribute('aria-checked', String(multi ? !!st.get(v) : String(st.get()) === v));
    }
    if (afterBox) afterBox.replaceChildren(st.after() || '');
  };
  for (const o of st.opts()) {
    group.append(optEl(o, multi, () => {
      hideErr();
      if (multi) { st.toggle(o.v); save(); draw(); return; }
      st.set(o.v); save(); draw();
      clearTimeout(advTimer);
      if (st.noAuto && st.noAuto(o.v)) {
        const f = afterBox && afterBox.querySelector('input:not([type=checkbox]), textarea');
        if (f && o.v === 'date') f.focus();
        return;
      }
      advTimer = setTimeout(() => { if (STEPS[cur] === st) next(); }, 230);
    }));
  }
  box.append(group);
  if (afterBox) box.append(afterBox);
  draw();
}
function renderTexte(st, box) {
  const area = st.kind === 'textarea';
  const el = area
    ? h('textarea', {rows: '5', placeholder: st.placeholder(), 'aria-labelledby': 'q', 'data-autofocus': true}, st.get())
    : h('input', {type: 'text', value: st.get(), placeholder: st.placeholder(), 'aria-labelledby': 'q', autocapitalize: 'words', autocomplete: 'off', enterkeyhint: 'next', 'data-autofocus': true});
  el.addEventListener('input', () => { st.set(el.value); save(); hideErr(); });
  if (!area) el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); next(); } });
  box.append(el);
}
function champ(label, facultatif, input) {
  return h('div', {class: 'field'},
    h('label', {for: input.id}, label, facultatif && h('span', {class: 'opt-l'}, ' (facultatif)')),
    input);
}
function stepper(get, set, min, max, label) {
  const out = h('output', {'aria-live': 'polite'}, String(get()));
  const upd = d => { const v = Math.min(max, Math.max(min, get() + d)); set(v); out.textContent = v; save(); };
  return h('div', {class: 'stepper', role: 'group', 'aria-label': label},
    h('button', {type: 'button', 'aria-label': 'Un de moins', onclick: () => upd(-1)}, '−'),
    out,
    h('button', {type: 'button', 'aria-label': 'Un de plus', onclick: () => upd(1)}, '+'));
}

  const drawRows = () => {
    list.replaceChildren(...S.dates.map((r, i) => {

        h('button', {type: 'button', class: 'rm', html: SVG_X, 'aria-label': `Retirer la date ${i + 1}`, hidden: S.dates.length < 2,
          onclick: () => { S.dates.splice(i, 1); drawRows(); save(); }}));

  drawRows();

/* Ville avec les communes proposées par geo.api.gouv.fr, pour calculer la distance. */
function champVille() {
  const input = h('input', {
    type: 'text', id: 'f-ville', value: S.ville, placeholder: 'Commune ou code postal',
    autocomplete: 'off', autocapitalize: 'words', enterkeyhint: 'search',
    role: 'combobox', 'aria-autocomplete': 'list', 'aria-expanded': 'false', 'aria-controls': 'f-ville-list',
  });
  const list = h('div', {class: 'sugg', id: 'f-ville-list', role: 'listbox', hidden: true});
  const info = h('p', {class: 'small ville-info', 'aria-live': 'polite'});
  let timer = null, seq = 0, items = [];
  const majInfo = () => {
    const dep = deplacement();
    if (S.lieuGeo) info.textContent = `${S.lieuGeo.nom}, ${S.lieuGeo.cp}${S.lieuGeo.dep ? ' (' + S.lieuGeo.dep + ')' : ''}${dep ? ` · environ ${dep.km} km de ${CONFIG.depart.nom}` : ''}`;
    else info.textContent = S.ville.trim() ? 'Choisissez la commune dans la liste pour que je calcule la distance. À l’étranger, laissez simplement le nom.' : '';
  };
  const fermer = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); };
  const choisir = it => {
    S.lieuGeo = it; S.ville = it.nom; input.value = it.nom;
    save(); fermer(); majInfo();
  };
  const chercher = async q => {
    const my = ++seq;
    const cp = /^\d{5}$/.test(q);
    if (!cp && (q.length < 2 || /^\d+$/.test(q))) { items = []; fermer(); return; }
    const url = 'https://geo.api.gouv.fr/communes?' + (cp ? 'codePostal=' + q : 'nom=' + encodeURIComponent(q) + '&boost=population')
      + '&fields=nom,codesPostaux,centre,departement,population' + (cp ? '' : '&limit=6');
    let res = [];
    try {
      const r = await fetch(url);
      const data = await r.json();
      if (cp) data.sort((a, b) => (b.population || 0) - (a.population || 0));
      res = data.filter(c => c.centre).slice(0, 6).map(c => ({
        nom: c.nom, cp: cp ? q : ((c.codesPostaux || [])[0] || ''), dep: c.departement ? c.departement.nom : '',
        lat: c.centre.coordinates[1], lon: c.centre.coordinates[0],
      }));
    } catch (e) { res = []; }
    if (my !== seq) return;
    items = res;
    list.replaceChildren(...items.map(it => h('button', {type: 'button', role: 'option', class: 'sugg-it', onclick: () => choisir(it)},
      h('b', {}, it.nom), ` ${it.cp}${it.dep ? ' · ' + it.dep : ''}`)));
    list.hidden = !items.length;
    input.setAttribute('aria-expanded', String(!!items.length));
  };
  input.addEventListener('input', () => {
    S.ville = input.value; S.lieuGeo = null; save(); majInfo();
    clearTimeout(timer);
    timer = setTimeout(() => chercher(input.value.trim()), 250);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); if (items.length && !list.hidden) choisir(items[0]); else input.blur(); }
    if (e.key === 'Escape') fermer();
  });
  input.addEventListener('blur', () => setTimeout(fermer, 250));
  majInfo();
  return h('div', {class: 'field'},
    h('label', {for: 'f-ville'}, 'Ville', h('span', {class: 'opt-l'}, ' (facultatif)')),
    input, list, info);
}

/* =====================================================================
   Navigation
   ===================================================================== */
function showErr(m) { $('#err').textContent = m; }
function hideErr() { const e = $('#err'); if (e) e.textContent = ''; }

function go(i, dir = 1, mode = 'push') {
  cur = i;
  render(dir);
  if (mode === 'push') { history.pushState({i}, ''); depth++; }
  else if (mode === 'replace') history.replaceState({i}, '');
  save();
}
const goId = (id, dir = 1) => go(idx(id), dir);

function validStep(st) {
  if (st.validate) return st.validate();
  if (st.kind === 'single') return st.get() ? null : 'Choisissez une réponse pour continuer.';
  return null;
}
function next() {
  clearTimeout(advTimer);
  const st = STEPS[cur];
  if (st.id === 'welcome') {
    if (resumeAt) { const i = resumeAt; resumeAt = null; return go(i); }
    return goId(preset ? 'nom' : 'type');
  }
  const err = validStep(st);
  if (err) { showErr(err); return; }
  if (st.id === 'contact') return envoyer($('#next'));
  const vis = visible().filter(s => !s.meta);
  const est = vis.findIndex(s => s.id === 'estimation');
  if (retourRecap && vis.slice(0, est).every(s => !validStep(s))) {
    retourRecap = false;
    return goId('estimation');
  }
  const i = vis.indexOf(st);
  go(STEPS.indexOf(vis[i + 1]));
}
function back() {
  clearTimeout(advTimer);
  if (depth > 0) { history.back(); return; }
  const vis = visible(), i = vis.indexOf(STEPS[cur]);
  if (i > 0) go(STEPS.indexOf(vis[i - 1]), -1, 'replace');
}
function edit(id) { retourRecap = true; go(idx(id), -1); }

window.addEventListener('popstate', e => {
  clearTimeout(advTimer);
  let i = e.state && Number.isInteger(e.state.i) ? e.state.i : 0;
  if (S.envoye && STEPS[i].id !== 'fin') { history.pushState({i: cur}, ''); return; }
  const dir = i < cur ? -1 : 1;
  depth = Math.max(0, depth + dir);
  if (STEPS[i].meta && STEPS[i].id !== 'welcome') i = idx('contact');
  while (i > 0 && !shown(STEPS[i])) i--;
  cur = i;
  render(dir);
  save();
});

/* =====================================================================
   Envoi
   ===================================================================== */
async function envoyer(btn) {
  if (sending) return;
  sending = true;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Envoi en cours…';
  let ok = false;
  try {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 20000);
    const r = await fetch(ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', Accept: 'application/json'},
      body: JSON.stringify(payload()), signal: ctl.signal,
    });
    clearTimeout(to);
    const j = await r.json().catch(() => ({}));
    ok = r.ok && String(j.success) === 'true';
  } catch (e) { ok = false; }
  sending = false;
  btn.disabled = false; btn.textContent = label;
  if (ok) { S.envoye = true; forget(); goId('fin'); }
  else if (STEPS[cur].id !== 'echec') goId('echec');
}

/* =====================================================================
   Sauvegarde du brouillon (sur ce téléphone seulement)
   ===================================================================== */
const KEY = 'tm-devis-1';
/* Bandeau « Estimation en cours » au-dessus du bouton, dès que les prestations sont connues. */
function majLive() {
  const el = $('#live');
  const st = STEPS[cur];
  const montrer = !st.meta && S.type && S.type !== 'autre' && idx(st.id) > idx('services') && st.id !== 'estimation' && st.id !== 'contact';
  const E = montrer ? estimer() : null;
  if (!E || E.mode === 'devis') { el.hidden = true; el.dataset.v = ''; return; }
  const txt = fourchette(E).big;
  el.hidden = false;
  if (el.dataset.v === txt) return;
  el.replaceChildren('Estimation en cours : ', h('b', {}, txt));
  if (el.dataset.v) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  el.dataset.v = txt;
}
function save() {
  majLive();
  if (S.envoye) return;
  try { localStorage.setItem(KEY, JSON.stringify({S, cur, t: Date.now()})); } catch (e) { /* navigation privée */ }
}
function forget() { try { localStorage.removeItem(KEY); } catch (e) { /* rien */ } }
function load() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY));
    if (o && o.S && Date.now() - o.t < 30 * 864e5) return o;
  } catch (e) { /* rien */ }
  return null;
}

/* =====================================================================
   Démarrage
   ===================================================================== */
$('#next').addEventListener('click', next);
$('#back').addEventListener('click', back);
const saved = load();
if (saved && saved.cur > 1 && STEPS[saved.cur] && !STEPS[saved.cur].meta && !saved.S.envoye) {
  const b = blank();
  S = {...b, ...saved.S, services: {...b.services, ...saved.S.services}, contact: {...b.contact, ...saved.S.contact}};
  resumeAt = shown(STEPS[saved.cur]) ? saved.cur : null;
}
const qType = new URLSearchParams(location.search).get('type');
if (!resumeAt && qType && TYPES[qType]) { setType(qType); preset = true; }
history.replaceState({i: 0}, '');
render(0);

// Accès pour les essais automatiques
window.TMDevis = {get S() { return S; }, set S(v) { S = v; }, get etape() { return STEPS[cur].id; }, estimer, fourchette, refPrix, rows, texte, payload, goId, T};
})();
